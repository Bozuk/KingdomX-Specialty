# ============================================================================ #
#  Entry added to the structure shop (nexus > Structures) by the Specialties    #
#  addon.                                                                       #
#                                                                              #
#  KingdomsX does not build that menu on its own: it walks the registered       #
#  structures and, for each of them, looks for an option OF THE SAME NAME in    #
#  the menu file. A structure with no entry here is skipped, without a single   #
#  message. Hence the addon adding its own on startup.                          #
#                                                                              #
#  Once written, this entry is yours: move it, rename it or restyle it like any #
#  other. The addon never writes over it. Deleting it takes the forge out of    #
#  the shop.                                                                    #
# ============================================================================ #
specialty-forge:
  name: "{$p}Specialty Forge"
  material: SMITHING_TABLE
  sound: BLOCK_ANVIL_USE
  lore: |
    {$s}The only place the items of the
    {$s}kingdom's specialty can be made.

    {$dot} {$p}Carbon weapons {$sep}beyond netherite
    {$dot} {$p}Mithril armor {$sep}beyond netherite
    {$dot} {$p}Potions and provisions {$sep}sublimated with goo

    {$sep}What the menu holds depends on the
    {$sep}specialty the kingdom picked.

    {$p}Cost{$colon} {$s}%fancy@cost%
  slot: %slot%
