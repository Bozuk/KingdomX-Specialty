# ============================================================================ #
#                          Forge de Specialite                                  #
#                                                                              #
#  Structure ajoutee par l'extension Specialties. Elle apparait dans la liste   #
#  des structures du royaume (/k structures) et se construit comme les autres.  #
#  Son menu permet de fabriquer les objets de la specialite du royaume.         #
#                                                                              #
#  Le champ 'type' doit rester 'specialty-forge' : c'est lui qui relie ce       #
#  fichier au code de l'extension.                                              #
# ============================================================================ #
(import):
  structure:
    parameters:
      <name>: specialty-forge
      <build-duration-factor>: '-30 seconds'
      <durability-factor>: 100
      <material-1>: SMITHING_TABLE
      <material-2>: SMITHING_TABLE
      <material-3>: SMITHING_TABLE

name: "{$p}Forge de Specialite"
type: specialty-forge
default-name: 'Forge de Specialite'

max-level: 1
upgrade-cost: lvl * 1000

limits:
  per-land: 1
  total: 3

cost: 3000
sell: 1500

item:
  1:
    name: "{$p}Forge de Specialite"
    material: SMITHING_TABLE
    lore: |
      {$s}Le seul endroit ou fabriquer les
      {$s}objets de la specialite du royaume.

      {$dot} {$p}Armes {$sep}de carbone, au-dela de la netherite
      {$dot} {$p}Armures {$sep}de mitril, au-dela de la netherite
      {$dot} {$p}Potions et vivres {$sep}sublimes au goo

      {$sep}Le contenu du menu depend de la
      {$sep}specialite choisie par le royaume.
