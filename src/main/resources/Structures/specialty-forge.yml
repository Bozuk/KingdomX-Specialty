# ============================================================================ #
#                             Specialty Forge                                   #
#                                                                              #
#  The structure this addon adds. It shows up in the kingdom's structure list   #
#  (/k structures) and is built like any other. Its menu is where the items of  #
#  the kingdom's specialty are made.                                            #
#                                                                              #
#  The 'type' field must stay 'specialty-forge': that is what ties this file    #
#  to the addon's code.                                                         #
# ============================================================================ #
(import):
  structure:
    parameters:
      <name>: specialty-forge
      <build-duration-factor>: '-30 seconds'
      <durability-factor>: 100
      <material-1>: SMITHING_TABLE
      <material-2>: SMITHING_TABLE
      <material-3>: SMITHING_TABLE

name: "{$p}Specialty Forge"
type: specialty-forge
default-name: 'Specialty Forge'

max-level: 1
upgrade-cost: lvl * 1000

limits:
  per-land: 1
  total: 3

cost: 3000
sell: 1500

item:
  1:
    name: "{$p}Specialty Forge"
    material: SMITHING_TABLE
    lore: |
      {$s}The only place the items of the
      {$s}kingdom's specialty can be made.

      {$dot} {$p}Carbon weapons {$sep}beyond netherite
      {$dot} {$p}Mithril armor {$sep}beyond netherite
      {$dot} {$p}Potions and provisions {$sep}sublimated with goo

      {$sep}What the menu holds depends on the
      {$sep}specialty the kingdom picked.
