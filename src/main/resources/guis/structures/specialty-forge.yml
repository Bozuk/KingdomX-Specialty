title: "{$sep}-=[ {$p}Specialty Forge {$sep}]=-"
rows: 6
sound: BLOCK_ANVIL_USE

options:
  decoration:
    slots: [ 0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 36, 44, 45, 46, 47, 49, 51, 52, 53 ]
    material: BLACK_STAINED_GLASS_PANE
    name: ''

  info:
    slot: 4
    material: PAPER
    name: '{$p}Specialty{$colon} {$s}%specialty%'
    lore: |
      {$p}Resource{$colon} {$s}%specialty_resource%
      {$p}Recipes{$colon} {$s}%recipes%

      {$sep}Ingredients are taken from
      {$sep}your own inventory.

  # One entry per recipe of the specialty. The name, the icon and the
  # description are replaced on opening by what specialties.yml holds.
  recipes:
    slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
    material: PAPER
    name: '{$p}Recipe'

  upgrade:
    slot: 48
    upgrade:
      condition: level < max_level
      name: "{$sp}Upgrade{$colon} {$s}%roman@level% {$sep}> {$s}%roman@next_level%"
      material: NETHER_STAR
      lore:
        - "{$dot} {$p}Cost{$colon} {$s}%upgrade_cost%"
    maxxed:
      name: "{$sp}Level{$colon} {$s}%roman@level%"
      material: NETHER_STAR
      lore:
        - "{$sep}Maximum level reached."

  break:
    slot: 50
    name: "&4Demolish"
    material: REDSTONE_BLOCK
    sound: ENTITY_ITEM_BREAK
    lore:
      - "{$s}Destroys the structure."
