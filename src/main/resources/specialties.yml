        enchantment: FORTUNE
        level: 5
        applies-to: [ '*_PICKAXE', '*_SHOVEL', '*_AXE' ]
        icon: EMERALD
        ingredients:
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
