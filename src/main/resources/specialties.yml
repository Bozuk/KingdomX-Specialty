# ============================================================================ #
#                        Kingdoms Addon - Specialties                          #
#                                                                              #
#  Chaque royaume choisit UNE specialite parmi 3, AU MOMENT DE SA CREATION :    #
#  /k create <nom> ouvre le menu des specialites, et le royaume n'est fonde     #
#  qu'une fois la specialite choisie. La specialite donne acces a une ressource #
#  unique, produite par les extracteurs de KingdomsX, qui sert a fabriquer des  #
#  objets exclusifs a la Forge de Specialite.                                   #
#                                                                              #
#  Le choix est DEFINITIF. Seul un admin peut le modifier :                     #
#     /k admin specialty <royaume> <specialite>                                 #
#     /k admin specialty <royaume> reset                                        #
# ============================================================================ #

selection:
  # Demander une confirmation avant de valider (le choix est irreversible).
  # S'applique aussi bien a la creation qu'au rattrapage ci-dessous.
  require-confirmation: true

  # ---------------------------------------------------------------------------
  #  Les options suivantes ne concernent QUE le rattrapage, c'est-a-dire la
  #  commande /k specialty choose. Elle ne sert qu'aux royaumes qui n'ont pas
  #  de specialite : ceux crees avant l'installation de l'extension, et ceux
  #  qu'un admin a reinitialises. Un royaume fonde normalement a deja la sienne.
  # ---------------------------------------------------------------------------

  # Seul le roi peut rattraper le choix.
  # Si false, tout membre ayant la permission de royaume "UPGRADE" peut le faire.
  king-only: true

  # Niveau minimum du royaume requis.
  required-level: 1

  # Cout du rattrapage.
  cost:
    resource-points: 0
    money: 0

# ============================================================================ #
#                                   MESSAGES                                    #
#                                                                              #
#  Les messages de l'extension vivent dans un fichier par langue :              #
#     plugins/Kingdoms/specialties/languages/<code>.yml                         #
#  Meme structure que les fichiers de langue de KingdomsX. Une cle absente      #
#  retombe sur le texte anglais integre a l'extension.                          #
#                                                                              #
#  Un fichier est cree pour chaque langue installee sur le serveur. Le francais #
#  (fr.yml) est fourni traduit, les autres sont generes en anglais, prets a     #
#  traduire.                                                                    #
# ============================================================================ #
messages:
  # Quel fichier de traduction utiliser pour quelle langue de KingdomsX.
  #
  # KingdomsX ne propose pas de locale francaise : les langues disponibles sont
  # en, de, es, it, pt, pl, ru, cs, hu, tr, uk, vi, zh. Un serveur francais
  # tourne donc en anglais, d'ou la correspondance EN -> fr livree par defaut,
  # qui accorde les messages avec les menus et les objets, eux aussi en francais.
  #
  # Supprimez la ligne pour revenir a l'anglais, ou pointez une autre langue
  # vers le fichier de votre choix, par exemple  DE: de
  language-files:
    EN: fr

# ============================================================================ #
#                                 PRODUCTION                                    #
#                                                                              #
#  La ressource de specialite est produite par les extracteurs de KingdomsX     #
#  (la structure "extractor"). Cette extension n'ajoute aucun bloc : quand un   #
#  membre collecte un extracteur, il recoit ses points de ressources habituels  #
#  ET la ressource unique de la specialite de son royaume.                      #
#                                                                              #
#  Un extracteur sans carburant ne genere aucun point de ressource, donc aucune #
#  ressource de specialite non plus. La quantite de carburant, la cadence et le #
#  rendement des extracteurs se reglent dans Structures/extractor.yml.          #
# ============================================================================ #
extraction:
  # Points de ressources generes par l'extracteur pour produire une unite
  # de la ressource de specialite.
  resource-points-per-unit: 100

  # Multiplicateur applique a la quantite produite. Expression mathematique
  # evaluee avec le contexte du royaume (kingdoms_level, kingdoms_members...).
  multiplier: '1'

  # Quantite maximale produite par collecte. 0 = illimite.
  max-per-collect: 0

  # Reporter le reliquat non converti sur la collecte suivante, au lieu de le
  # perdre. Sans cela, collecter souvent de petites quantites ne produit jamais
  # rien.
  carry-over-remainder: true

  # Si l'inventaire du collecteur est plein, faire tomber les objets a ses pieds.
  # Sinon, le surplus est reporte sur la collecte suivante.
  drop-if-inventory-full: true

# ============================================================================ #
#                              LES 3 SPECIALITES                                #
#                                                                              #
#  Les cles doivent rester : weaponsmith, armorer, alchemist                    #
#                                                                              #
#  Tout se fabrique a la Forge de Specialite (Structures/specialty-forge.yml),  #
#  jamais a l'etabli. Les ingredients sont pris dans l'inventaire du joueur.    #
#                                                                              #
#  Types de recette :                                                           #
#    SHAPED     : 'shape' (1 a 3 lignes) + 'ingredients' (lettre -> materiau).  #
#                 La forge n'a pas de grille : la forme sert uniquement a       #
#                 compter combien d'exemplaires de chaque ingredient il faut.   #
#    SHAPELESS  : 'ingredients' est une liste ; repeter une entree en demande   #
#                 plusieurs.                                                    #
#    TRANSMUTE  : comme SHAPELESS, mais un ingredient supplementaire - la       #
#                 'source' - est une potion dont l'effet est REPRIS par le      #
#                 resultat. La duree et le niveau ne sont pas ecrits ici : ils  #
#                 sont lus sur la fiole apportee par le joueur. C'est ce qui    #
#                 permet a une potion de poison de devenir une potion de wither #
#                 de la meme duree et du meme niveau, quelle que soit la fiole. #
#                                                                              #
#  Les noms d'effets acceptent les deux orthographes : STRENGTH comme          #
#  INCREASE_DAMAGE, 1.20.5 ayant renomme les effets.                            #
#                                                                              #
#  '@resource' designe la ressource unique de la specialite.                    #
#                                                                              #
#  Un objet ('result' ou 'resource') se decrit ainsi :                          #
#    material / amount / name / lore / custom-model-data / unbreakable /        #
#    glow / enchants / stored-enchants / item-flags / potion / attributes /     #
#    consume-effects                                                            #
#                                                                              #
#  'glow' donne le reflet enchante sans enchantement quand le serveur le permet #
#  (1.20.5+). Sur un serveur plus ancien, il retombe sur l'astuce habituelle -  #
#  Solidite I masquee - qui, elle, change legerement l'objet.                   #
#                                                                              #
#  'consume-effects' donne des effets a un ALIMENT quand il est mange. Les      #
#  effets d'une pomme d'or sont codes en dur dans le jeu et ne s'editent pas :  #
#  ils sont donc appliques par l'extension au moment ou l'objet est consomme,   #
#  juste avant ceux du jeu, qui ne peuvent alors plus les affaiblir.            #
#                                                                              #
#  'attributes' remplace les statistiques de base de l'objet : c'est ce qui     #
#  permet de depasser reellement la netherite. Quand vous en definissez un sur  #
#  une arme ou une armure, precisez TOUTES les statistiques voulues, car celles #
#  d'origine ne s'appliquent plus - la portee d'une lance comprise.             #
#  Reperes vanilla (valeur affichee dans l'infobulle entre parentheses) :       #
#    epee netherite      = 7 (8) degats   / -2.4 (1.6) vitesse                  #
#    hache netherite     = 9 (10) degats  / -3.0 (1.0) vitesse                  #
#    lance netherite     = 4 (5) degats   / -3.13 (0.87) vitesse                #
#    casque netherite    = 3 armure / 3 resistance / 0.1 resistance au recul    #
#    plastron netherite  = 8 armure / 3 resistance / 0.1 resistance au recul    #
#    jambieres netherite = 6 armure / 3 resistance / 0.1 resistance au recul    #
#    bottes netherite    = 3 armure / 3 resistance / 0.1 resistance au recul    #
# ============================================================================ #
specialties:

  # ---------------------------------------------------------------- ARMES ----
  #  Ressource : le Carbone. Il forge l'epee, la hache et la lance.
  #  Les objets gardent le visuel et les caracteristiques de la netherite,
  #  a une difference pres : +2 degats d'attaque.
  weaponsmith:
    display-name: '&c&lForgeron de Guerre'
    icon: NETHERITE_SWORD
    description:
      - '&7Vos forges ne battent que pour la guerre.'
      - '&7Ressource unique&8: &8&lCarbone'
      - '&7Debloque&8: &fles armes de carbone &8(&f+2 degats&8)'

    resource:
      material: COAL
      name: '&8&lCarbone'
      glow: true
      lore:
        - '&8Ressource de specialite'
        - '&7Extrait par les forgerons du royaume.'

    recipes:
      epee-de-carbone:
        type: SHAPELESS
        display-name: '&8&lEpee de Carbone'
        description:
          - '&7Une epee de netherite, &f+2 &7degats&8:'
          - '&f10 &7degats contre &f8&7.'
        ingredients:
          - NETHERITE_SWORD
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_SWORD
          name: '&8&lEpee de Carbone'
          glow: true
          lore:
            - '&7Trempee dans le carbone du royaume.'
          attributes:
            GENERIC_ATTACK_DAMAGE:
              amount: 9
              operation: ADD_NUMBER
              slot: HAND
            GENERIC_ATTACK_SPEED:
              amount: -2.4
              operation: ADD_NUMBER
              slot: HAND

      hache-de-carbone:
        type: SHAPELESS
        display-name: '&8&lHache de Carbone'
        description:
          - '&7Une hache de netherite, &f+2 &7degats&8:'
          - '&f12 &7degats contre &f10&7.'
        ingredients:
          - NETHERITE_AXE
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_AXE
          name: '&8&lHache de Carbone'
          glow: true
          lore:
            - '&7Trempee dans le carbone du royaume.'
          attributes:
            GENERIC_ATTACK_DAMAGE:
              amount: 11
              operation: ADD_NUMBER
              slot: HAND
            GENERIC_ATTACK_SPEED:
              amount: -3.0
              operation: ADD_NUMBER
              slot: HAND

      # La lance existe depuis la 1.21.11. Sur un serveur plus ancien, le
      # materiau est inconnu : la recette est ignoree avec un avertissement
      # dans la console, le reste de la specialite fonctionne normalement.
      #
      # ENTITY_INTERACTION_RANGE est la portee de la lance : elle vient d'un
      # attribut, que definir 'attributes' remettrait a zero. Elle est donc
      # redeclaree ici, comme les degats et la vitesse.
      lance-de-carbone:
        type: SHAPELESS
        display-name: '&8&lLance de Carbone'
        description:
          - '&7Une lance de netherite, &f+2 &7degats&8:'
          - '&f7 &7degats contre &f5&7.'
        ingredients:
          - NETHERITE_SPEAR
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_SPEAR
          name: '&8&lLance de Carbone'
          glow: true
          lore:
            - '&7Trempee dans le carbone du royaume.'
          attributes:
            GENERIC_ATTACK_DAMAGE:
              amount: 6
              operation: ADD_NUMBER
              slot: HAND
            GENERIC_ATTACK_SPEED:
              amount: -3.13
              operation: ADD_NUMBER
              slot: HAND
            ENTITY_INTERACTION_RANGE:
              amount: 1.5
              operation: ADD_NUMBER
              slot: HAND

  # -------------------------------------------------------------- ARMURES ----
  #  Ressource : le Mitril. Il forge les quatre pieces d'armure.
  #  Les objets gardent le visuel et les caracteristiques de la netherite,
  #  a deux differences pres : +2 d'armure et +1 de resistance.
  armorer:
    display-name: '&b&lArmurier Royal'
    icon: NETHERITE_CHESTPLATE
    description:
      - '&7Nul ne perce vos lignes.'
      - '&7Ressource unique&8: &bMitril'
      - '&7Debloque&8: &fles armures de mitril &8(&f+2 armure, +1 resistance&8)'

    resource:
      material: IRON_INGOT
      name: '&b&lMitril'
      glow: true
      lore:
        - '&8Ressource de specialite'
        - '&7Martele par les armuriers du royaume.'

    recipes:
      casque-de-mitril:
        type: SHAPELESS
        display-name: '&b&lCasque de Mitril'
        description:
          - '&f5 &7armure contre &f3&7,'
          - '&f4 &7de resistance contre &f3&7.'
        ingredients:
          - NETHERITE_HELMET
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_HELMET
          name: '&b&lCasque de Mitril'
          glow: true
          lore:
            - '&7Martele dans le mitril du royaume.'
          attributes:
            GENERIC_ARMOR:
              amount: 5
              operation: ADD_NUMBER
              slot: HEAD
            GENERIC_ARMOR_TOUGHNESS:
              amount: 4
              operation: ADD_NUMBER
              slot: HEAD
            GENERIC_KNOCKBACK_RESISTANCE:
              amount: 0.1
              operation: ADD_NUMBER
              slot: HEAD

      plastron-de-mitril:
        type: SHAPELESS
        display-name: '&b&lPlastron de Mitril'
        description:
          - '&f10 &7armure contre &f8&7,'
          - '&f4 &7de resistance contre &f3&7.'
        ingredients:
          - NETHERITE_CHESTPLATE
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_CHESTPLATE
          name: '&b&lPlastron de Mitril'
          glow: true
          lore:
            - '&7Martele dans le mitril du royaume.'
          attributes:
            GENERIC_ARMOR:
              amount: 10
              operation: ADD_NUMBER
              slot: CHEST
            GENERIC_ARMOR_TOUGHNESS:
              amount: 4
              operation: ADD_NUMBER
              slot: CHEST
            GENERIC_KNOCKBACK_RESISTANCE:
              amount: 0.1
              operation: ADD_NUMBER
              slot: CHEST

      pantalon-de-mitril:
        type: SHAPELESS
        display-name: '&b&lPantalon de Mitril'
        description:
          - '&f8 &7armure contre &f6&7,'
          - '&f4 &7de resistance contre &f3&7.'
        ingredients:
          - NETHERITE_LEGGINGS
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_LEGGINGS
          name: '&b&lPantalon de Mitril'
          glow: true
          lore:
            - '&7Martele dans le mitril du royaume.'
          attributes:
            GENERIC_ARMOR:
              amount: 8
              operation: ADD_NUMBER
              slot: LEGS
            GENERIC_ARMOR_TOUGHNESS:
              amount: 4
              operation: ADD_NUMBER
              slot: LEGS
            GENERIC_KNOCKBACK_RESISTANCE:
              amount: 0.1
              operation: ADD_NUMBER
              slot: LEGS

      bottes-de-mitril:
        type: SHAPELESS
        display-name: '&b&lBottes de Mitril'
        description:
          - '&f5 &7armure contre &f3&7,'
          - '&f4 &7de resistance contre &f3&7.'
        ingredients:
          - NETHERITE_BOOTS
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_BOOTS
          name: '&b&lBottes de Mitril'
          glow: true
          lore:
            - '&7Martelees dans le mitril du royaume.'
          attributes:
            GENERIC_ARMOR:
              amount: 5
              operation: ADD_NUMBER
              slot: FEET
            GENERIC_ARMOR_TOUGHNESS:
              amount: 4
              operation: ADD_NUMBER
              slot: FEET
            GENERIC_KNOCKBACK_RESISTANCE:
              amount: 0.1
              operation: ADD_NUMBER
              slot: FEET

  # ---------------------------------------------------- POTIONS ET NOURRITURE -
  #  Ressource : le Goo. Il transforme un objet existant en sa version sublimee,
  #  qui garde son visuel d'origine et gagne le reflet enchante.
  alchemist:
    display-name: '&d&lAlchimiste'
    icon: BREWING_STAND
    description:
      - '&7Vos fioles valent des armees.'
      - '&7Ressource unique&8: &aGoo'
      - '&7Debloque&8: &fles potions et les vivres sublimes'

    resource:
      material: SLIME_BALL
      name: '&a&lGoo'
      glow: true
      lore:
        - '&8Ressource de specialite'
        - '&7Distille par les alchimistes du royaume.'

    recipes:
      # Potion de poison + Goo = potion de wither.
      # La duree et le niveau sont repris de la fiole consommee : un poison
      # allonge donne un wither allonge, un poison II donne un wither II.
      potion-de-wither:
        type: TRANSMUTE
        display-name: '&8&lPotion de Wither'
        icon: POTION
        description:
          - '&7Le poison vire au fletrissement.'
          - '&8Meme duree et meme niveau que la fiole utilisee.'
        source:
          material: POTION
          effect: POISON
          name: '&2Potion de Poison'
        ingredients:
          - '@resource'
        transmute:
          effect: WITHER
          amplifier-shift: 0
        result:
          material: POTION
          name: '&8&lPotion de Wither'
          glow: true
          lore:
            - '&7Sublimee au goo du royaume.'
          potion:
            color: '#3b3b3b'

      # Potion de force II + Goo = potion de force III, meme duree.
      # 'amplifier: 1' vise la force II exactement : sans cela, la force III
      # produite ici pourrait a son tour etre transmutee en force IV.
      potion-de-force-iii:
        type: TRANSMUTE
        display-name: '&4&lPotion de Force III'
        icon: POTION
        description:
          - '&7Un cran au-dessus de la force II.'
          - '&8Meme duree que la fiole utilisee.'
        source:
          material: POTION
          effect: STRENGTH
          amplifier: 1
          name: '&4Potion de Force II'
        ingredients:
          - '@resource'
        transmute:
          effect: STRENGTH
          amplifier-shift: 1
        result:
          material: POTION
          name: '&4&lPotion de Force III'
          glow: true
          lore:
            - '&7Sublimee au goo du royaume.'
          potion:
            color: '#c02020'

      # Pomme d'or + Goo = pomme d'or sublimee.
      # Absorption II et Regeneration IV, contre I et II pour la pomme normale.
      # Les effets d'un aliment ne s'editent pas : ils sont appliques par
      # l'extension a la consommation, voir 'consume-effects' plus haut.
      pomme-d-or-sublimee:
        type: SHAPELESS
        display-name: '&6&lPomme d Or Sublimee'
        description:
          - '&7Absorption &fII &7contre &fI&7,'
          - '&7Regeneration &fIV &7contre &fII&7.'
        ingredients:
          - GOLDEN_APPLE
          - '@resource'
        result:
          material: GOLDEN_APPLE
          name: '&6&lPomme d Or Sublimee'
          glow: true
          lore:
            - '&7Sublimee au goo du royaume.'
          consume-effects:
            ABSORPTION:
              duration: 2min
              amplifier: 1
            REGENERATION:
              duration: 5s
              amplifier: 3
