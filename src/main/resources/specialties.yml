          - '@resource'
          - '@resource'

      efficiency-viii:
        type: ENCHANT
        display-name: '&5Efficacite VIII'
        enchantment: EFFICIENCY
        level: 8
        applies-to: [ '*_PICKAXE', '*_AXE', '*_SHOVEL', '*_HOE' ]
        icon: DIAMOND_PICKAXE
        ingredients:
          - '@resource'
