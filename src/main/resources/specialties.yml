# ============================================================================ #
#                        Kingdoms Addon - Specialties                          #
#                                                                              #
#  Every kingdom picks ONE of 3 specialties, WHEN IT IS FOUNDED: /k create      #
#  <name> opens the specialty menu, and the kingdom only comes into existence   #
#  once the choice is made. A specialty grants a unique resource, produced by   #
#  the KingdomsX extractors, which is what the exclusive items of the Specialty #
#  Forge are made of.                                                           #
#                                                                              #
#  The choice is FINAL. Only an admin can change it:                            #
#     /k admin specialty <kingdom> <specialty>                                  #
#     /k admin specialty <kingdom> reset                                        #
# ============================================================================ #

selection:
  # Ask for a confirmation before committing (the choice cannot be undone).
  # Applies both to the founding of a kingdom and to the catch-up below.
  require-confirmation: true

  # ---------------------------------------------------------------------------
  #  The options below only concern the catch-up, that is the
  #  /k specialty choose command. It exists for the kingdoms that have no
  #  specialty: those founded before this addon was installed, and those an
  #  admin has reset. A kingdom founded normally already has one.
  # ---------------------------------------------------------------------------

  # Only the king may pick the specialty afterwards.
  # When false, any member with the "UPGRADE" kingdom permission can.
  king-only: true

  # Minimum kingdom level required.
  required-level: 1

  # What the catch-up costs.
  cost:
    resource-points: 0
    money: 0

# ============================================================================ #
#                                   MESSAGES                                    #
#                                                                              #
#  The addon's messages live in one file per language:                          #
#     plugins/Kingdoms/specialties/languages/<code>.yml                         #
#  Same layout as the KingdomsX language files. A missing key falls back to     #
#  the English text built into the addon.                                       #
#                                                                              #
#  A file is created for every language installed on the server. French         #
#  (fr.yml) ships translated, the others are generated from the English texts,  #
#  ready to be translated.                                                      #
#                                                                              #
#  A language reads the file of its own code, and nothing has to be written     #
#  down for that. The exception is a language KingdomsX does not have: it has   #
#  no French locale - the ones it ships are en, de, es, it, pt, pl, ru, cs, hu, #
#  tr, uk, vi, zh - so a French server runs in English. Pointing EN at fr.yml   #
#  is what gives it French messages. Uncomment to do so:                        #
#                                                                              #
#     messages:                                                                 #
#       language-files:                                                         #
#         EN: fr                                                                #
# ============================================================================ #

# ============================================================================ #
#                                 PRODUCTION                                    #
#                                                                              #
#  The specialty resource is produced by the KingdomsX extractors (the          #
#  "extractor" structure). This addon adds no block of its own: when a member   #
#  collects an extractor, they receive its usual resource points AND the unique #
#  resource of their kingdom's specialty.                                       #
#                                                                              #
#  An extractor with no fuel generates no resource point, hence no specialty    #
#  resource either. Fuel, rate and yield are configured on the KingdomsX side,  #
#  in Structures/extractor.yml.                                                 #
# ============================================================================ #
extraction:
  # Resource points an extractor has to generate for one unit of the
  # specialty resource to be produced.
  resource-points-per-unit: 100

  # Multiplier applied to the produced amount. A math expression, evaluated
  # with the kingdom's context (kingdoms_level, kingdoms_members...).
  multiplier: '1'

  # Largest amount produced by a single collect. 0 = no limit.
  max-per-collect: 0

  # Carry what could not be converted over to the next collect instead of
  # losing it. Without this, collecting small amounts often would never produce
  # anything at all.
  carry-over-remainder: true

  # When the collector's inventory is full, drop the items at their feet.
  # Otherwise the surplus is carried over to the next collect.
  drop-if-inventory-full: true

# ============================================================================ #
#                             THE 3 SPECIALTIES                                 #
#                                                                              #
#  The keys must stay: weaponsmith, armorer, alchemist                          #
#                                                                              #
#  Everything is made at the Specialty Forge                                    #
#  (Structures/specialty-forge.yml), never at a crafting table. Ingredients     #
#  are taken from the player's inventory.                                       #
#                                                                              #
#  Recipe types:                                                                #
#    SHAPED     : 'shape' (1 to 3 rows) + 'ingredients' (letter -> material).   #
#                 The forge has no crafting grid: a shape is only read to count #
#                 how many of each ingredient the recipe needs.                 #
#    SHAPELESS  : 'ingredients' is a list; repeating an entry asks for more.    #
#    TRANSMUTE  : like SHAPELESS, but one further ingredient - the 'source' -   #
#                 is a potion whose effect is CARRIED OVER to the result. The   #
#                 duration and the level are not written here: they are read    #
#                 off the bottle the player brought. That is what turns a       #
#                 poison potion into a wither potion of the very same duration  #
#                 and level, whichever bottle it was.                           #
#                                                                              #
#  Effect and attribute names accept every spelling they ever had: STRENGTH as  #
#  well as INCREASE_DAMAGE, ARMOR as well as GENERIC_ARMOR. XSeries maps them   #
#  onto whatever the running server calls them.                                 #
#                                                                              #
#  '@resource' stands for the unique resource of the specialty.                 #
#                                                                              #
#  ---------------------------------------------------------------------------  #
#  An item ('result' or 'resource') is described with THE VERY SYNTAX of any    #
#  KingdomsX item: it is the main plugin's own deserializer that reads it. So   #
#  material / amount / name / lore / enchants / stored-enchants / flags /       #
#  attributes / effects / color / custom-model-data / unbreakable / glow /      #
#  damage / skull / trim / item-model / nbt ... see the files of the main       #
#  plugin for the full list.                                                    #
#                                                                              #
#  Two further options belong to this addon:                                    #
#                                                                              #
#    glint : the enchanted shimmer through the component made for it (1.20.5+). #
#            Prefer it over 'glow', which gets the same shimmer out of a hidden #
#            enchantment - and so hands the item a very real Unbreaking I,      #
#            which breaks "the same stats as netherite".                        #
#                                                                              #
#    consume-effects : what a FOOD item hands out when eaten. A golden apple's  #
#            effects are hardcoded in the game and cannot be edited: the addon  #
#            applies these itself when the item is consumed, just before the    #
#            game applies its own, which can then no longer weaken them.        #
#            Same shape as 'effects':  'EFFECT, seconds, level'                 #
#            The level starts at 1:  'ABSORPTION, 120, 2'  =  Absorption II     #
#            for two minutes.                                                   #
#  ---------------------------------------------------------------------------  #
#                                                                              #
#  'attributes' replaces the item's base stats: that is what makes it possible  #
#  to genuinely outclass netherite. Whenever you define one on a weapon or a    #
#  piece of armor, spell out EVERY stat you want, because the original ones no  #
#  longer apply - a spear's reach included.                                     #
#                                                                              #
#  An attribute's 'name' is the modifier's identifier. Without one, XSeries     #
#  makes up a random UUID and the item stops being the same from one restart to #
#  the next. Give it one, lower case, in 'namespace:key' form.                  #
#                                                                              #
#  Vanilla figures (the tooltip value in brackets):                             #
#    netherite sword      = 7 (8) damage   / -2.4 (1.6) attack speed            #
#    netherite axe        = 9 (10) damage  / -3.0 (1.0) attack speed            #
#    netherite spear      = 4 (5) damage   / -3.13 (0.87) attack speed          #
#    netherite helmet     = 3 armor / 3 toughness / 0.1 knockback resistance    #
#    netherite chestplate = 8 armor / 3 toughness / 0.1 knockback resistance    #
#    netherite leggings   = 6 armor / 3 toughness / 0.1 knockback resistance    #
#    netherite boots      = 3 armor / 3 toughness / 0.1 knockback resistance    #
# ============================================================================ #
specialties:

  # -------------------------------------------------------------- WEAPONS ----
  #  Resource: Carbon. It forges the sword, the axe and the spear.
  #  The items keep the look and the stats of netherite, with one difference:
  #  +2 attack damage.
  weaponsmith:
    display-name: '&c&lWarsmith'
    icon: NETHERITE_SWORD
    description:
      - '&7Your forges beat for war and nothing else.'
      - '&7Unique resource&8: &8&lCarbon'
      - '&7Unlocks&8: &fcarbon weapons &8(&f+2 damage&8)'

    resource:
      material: COAL
      name: '&8&lCarbon'
      glint: true
      lore:
        - '&8Specialty resource'
        - '&7Drawn out by the smiths of the kingdom.'

    recipes:
      carbon-sword:
        type: SHAPELESS
        display-name: '&8&lCarbon Sword'
        description:
          - '&7A netherite sword, &f+2 &7damage&8:'
          - '&f10 &7damage against &f8&7.'
        ingredients:
          - NETHERITE_SWORD
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_SWORD
          name: '&8&lCarbon Sword'
          glint: true
          lore:
            - '&7Tempered in the carbon of the kingdom.'
          attributes:
            ATTACK_DAMAGE:
              name: specialties:carbon-sword-attack-damage
              amount: 9
              operation: ADD_NUMBER
              slot: HAND
            ATTACK_SPEED:
              name: specialties:carbon-sword-attack-speed
              amount: -2.4
              operation: ADD_NUMBER
              slot: HAND

      carbon-axe:
        type: SHAPELESS
        display-name: '&8&lCarbon Axe'
        description:
          - '&7A netherite axe, &f+2 &7damage&8:'
          - '&f12 &7damage against &f10&7.'
        ingredients:
          - NETHERITE_AXE
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_AXE
          name: '&8&lCarbon Axe'
          glint: true
          lore:
            - '&7Tempered in the carbon of the kingdom.'
          attributes:
            ATTACK_DAMAGE:
              name: specialties:carbon-axe-attack-damage
              amount: 11
              operation: ADD_NUMBER
              slot: HAND
            ATTACK_SPEED:
              name: specialties:carbon-axe-attack-speed
              amount: -3.0
              operation: ADD_NUMBER
              slot: HAND

      # Spears exist since 1.21.11. On an older server the material is unknown:
      # the recipe is skipped with a message in the console, and the rest of the
      # specialty works as usual.
      #
      # ENTITY_INTERACTION_RANGE is the spear's reach: it comes from an
      # attribute, which defining 'attributes' would wipe. So it is declared
      # again here, alongside the damage and the attack speed.
      carbon-spear:
        type: SHAPELESS
        display-name: '&8&lCarbon Spear'
        description:
          - '&7A netherite spear, &f+2 &7damage&8:'
          - '&f7 &7damage against &f5&7.'
        ingredients:
          - NETHERITE_SPEAR
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_SPEAR
          name: '&8&lCarbon Spear'
          glint: true
          lore:
            - '&7Tempered in the carbon of the kingdom.'
          attributes:
            ATTACK_DAMAGE:
              name: specialties:carbon-spear-attack-damage
              amount: 6
              operation: ADD_NUMBER
              slot: HAND
            ATTACK_SPEED:
              name: specialties:carbon-spear-attack-speed
              amount: -3.13
              operation: ADD_NUMBER
              slot: HAND
            ENTITY_INTERACTION_RANGE:
              name: specialties:carbon-spear-entity-interaction-range
              amount: 1.5
              operation: ADD_NUMBER
              slot: HAND

  # ---------------------------------------------------------------- ARMOR ----
  #  Resource: Mithril. It forges the four pieces of armor.
  #  The items keep the look and the stats of netherite, with two differences:
  #  +2 armor and +1 armor toughness.
  armorer:
    display-name: '&b&lRoyal Armorer'
    icon: NETHERITE_CHESTPLATE
    description:
      - '&7No one breaks your lines.'
      - '&7Unique resource&8: &bMithril'
      - '&7Unlocks&8: &fmithril armor &8(&f+2 armor, +1 toughness&8)'

    resource:
      material: IRON_INGOT
      name: '&b&lMithril'
      glint: true
      lore:
        - '&8Specialty resource'
        - '&7Hammered out by the armorers of the kingdom.'

    recipes:
      mithril-helmet:
        type: SHAPELESS
        display-name: '&b&lMithril Helmet'
        description:
          - '&f5 &7armor against &f3&7,'
          - '&f4 &7toughness against &f3&7.'
        ingredients:
          - NETHERITE_HELMET
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_HELMET
          name: '&b&lMithril Helmet'
          glint: true
          lore:
            - '&7Hammered from the mithril of the kingdom.'
          attributes:
            ARMOR:
              name: specialties:mithril-helmet-armor
              amount: 5
              operation: ADD_NUMBER
              slot: HEAD
            ARMOR_TOUGHNESS:
              name: specialties:mithril-helmet-armor-toughness
              amount: 4
              operation: ADD_NUMBER
              slot: HEAD
            KNOCKBACK_RESISTANCE:
              name: specialties:mithril-helmet-knockback-resistance
              amount: 0.1
              operation: ADD_NUMBER
              slot: HEAD

      mithril-chestplate:
        type: SHAPELESS
        display-name: '&b&lMithril Chestplate'
        description:
          - '&f10 &7armor against &f8&7,'
          - '&f4 &7toughness against &f3&7.'
        ingredients:
          - NETHERITE_CHESTPLATE
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_CHESTPLATE
          name: '&b&lMithril Chestplate'
          glint: true
          lore:
            - '&7Hammered from the mithril of the kingdom.'
          attributes:
            ARMOR:
              name: specialties:mithril-chestplate-armor
              amount: 10
              operation: ADD_NUMBER
              slot: CHEST
            ARMOR_TOUGHNESS:
              name: specialties:mithril-chestplate-armor-toughness
              amount: 4
              operation: ADD_NUMBER
              slot: CHEST
            KNOCKBACK_RESISTANCE:
              name: specialties:mithril-chestplate-knockback-resistance
              amount: 0.1
              operation: ADD_NUMBER
              slot: CHEST

      mithril-leggings:
        type: SHAPELESS
        display-name: '&b&lMithril Leggings'
        description:
          - '&f8 &7armor against &f6&7,'
          - '&f4 &7toughness against &f3&7.'
        ingredients:
          - NETHERITE_LEGGINGS
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_LEGGINGS
          name: '&b&lMithril Leggings'
          glint: true
          lore:
            - '&7Hammered from the mithril of the kingdom.'
          attributes:
            ARMOR:
              name: specialties:mithril-leggings-armor
              amount: 8
              operation: ADD_NUMBER
              slot: LEGS
            ARMOR_TOUGHNESS:
              name: specialties:mithril-leggings-armor-toughness
              amount: 4
              operation: ADD_NUMBER
              slot: LEGS
            KNOCKBACK_RESISTANCE:
              name: specialties:mithril-leggings-knockback-resistance
              amount: 0.1
              operation: ADD_NUMBER
              slot: LEGS

      mithril-boots:
        type: SHAPELESS
        display-name: '&b&lMithril Boots'
        description:
          - '&f5 &7armor against &f3&7,'
          - '&f4 &7toughness against &f3&7.'
        ingredients:
          - NETHERITE_BOOTS
          - '@resource'
          - '@resource'
          - '@resource'
          - '@resource'
        result:
          material: NETHERITE_BOOTS
          name: '&b&lMithril Boots'
          glint: true
          lore:
            - '&7Hammered from the mithril of the kingdom.'
          attributes:
            ARMOR:
              name: specialties:mithril-boots-armor
              amount: 5
              operation: ADD_NUMBER
              slot: FEET
            ARMOR_TOUGHNESS:
              name: specialties:mithril-boots-armor-toughness
              amount: 4
              operation: ADD_NUMBER
              slot: FEET
            KNOCKBACK_RESISTANCE:
              name: specialties:mithril-boots-knockback-resistance
              amount: 0.1
              operation: ADD_NUMBER
              slot: FEET

  # ----------------------------------------------------- POTIONS AND FOOD ----
  #  Resource: Goo. It turns an existing item into its sublimated version,
  #  which keeps its original look and gains the enchanted shimmer.
  alchemist:
    display-name: '&d&lAlchemist'
    icon: BREWING_STAND
    description:
      - '&7Your vials are worth armies.'
      - '&7Unique resource&8: &aGoo'
      - '&7Unlocks&8: &fsublimated potions and provisions'

    resource:
      material: SLIME_BALL
      name: '&a&lGoo'
      glint: true
      lore:
        - '&8Specialty resource'
        - '&7Distilled by the alchemists of the kingdom.'

    recipes:
      # Poison potion + Goo = wither potion.
      # The duration and the level are carried over from the bottle that was
      # used: a long poison gives a long wither, a poison II gives a wither II.
      wither-potion:
        type: TRANSMUTE
        display-name: '&8&lPotion of Withering'
        icon: POTION
        description:
          - '&7Poison turns to withering.'
          - '&8Same duration and level as the bottle used.'
        source:
          material: POTION
          effect: POISON
          name: '&2Potion of Poison'
        ingredients:
          - '@resource'
        transmute:
          effect: WITHER
          amplifier-shift: 0
        result:
          material: POTION
          name: '&8&lPotion of Withering'
          glint: true
          color: '#3b3b3b'
          lore:
            - '&7Sublimated with the goo of the kingdom.'

      # Strength II potion + Goo = strength III potion, same duration.
      # 'amplifier: 1' aims at strength II exactly: without it, the strength III
      # made here could in turn be transmuted into a strength IV.
      strength-iii-potion:
        type: TRANSMUTE
        display-name: '&4&lPotion of Strength III'
        icon: POTION
        description:
          - '&7One notch above strength II.'
          - '&8Same duration as the bottle used.'
        source:
          material: POTION
          effect: STRENGTH
          amplifier: 1
          name: '&4Potion of Strength II'
        ingredients:
          - '@resource'
        transmute:
          effect: STRENGTH
          amplifier-shift: 1
        result:
          material: POTION
          name: '&4&lPotion of Strength III'
          glint: true
          color: '#c02020'
          lore:
            - '&7Sublimated with the goo of the kingdom.'

      # Golden apple + Goo = sublimated golden apple.
      # Absorption II and Regeneration IV, against I and II for the plain one.
      # A food item's effects cannot be edited: they are applied by the addon
      # when it is consumed, see 'consume-effects' above.
      sublimated-golden-apple:
        type: SHAPELESS
        display-name: '&6&lSublimated Golden Apple'
        description:
          - '&7Absorption &fII &7against &fI&7,'
          - '&7Regeneration &fIV &7against &fII&7.'
        ingredients:
          - GOLDEN_APPLE
          - '@resource'
        result:
          material: GOLDEN_APPLE
          name: '&6&lSublimated Golden Apple'
          glint: true
          lore:
            - '&7Sublimated with the goo of the kingdom.'
          consume-effects:
            - 'ABSORPTION, 120, 2'
            - 'REGENERATION, 5, 4'
